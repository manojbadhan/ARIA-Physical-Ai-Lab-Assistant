{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<section class="auth"><form class="card" method="post" action="/api/auth/login">
  <h1 style="font-size:36px;margin-bottom:18px">Log in</h1>
  <div class="field"><label for="email">EMAIL</label><input id="email" name="email" type="email" autocomplete="username" required></div>
  <div class="field"><label for="pw">PASSWORD</label><input id="pw" name="password" type="password" autocomplete="current-password" required></div>
  <button class="b" style="width:100%">Log in <i class="ar"></i></button>
  <p class="mono" style="margin-top:16px">No account? <a href="/signup">Sign up</a></p>
</form></section>
{% endblock %}
